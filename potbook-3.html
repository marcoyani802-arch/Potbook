    guard += 1;
    const pay = Math.min(debt[i].amt, cred[j].amt);
    if (pay > 0.5) out.push({ from: debt[i].id, to: cred[j].id, amount: Math.round(pay) });
    debt[i].amt -= pay;
    cred[j].amt -= pay;
    if (debt[i].amt <= 0.5) i += 1;
    if (cred[j].amt <= 0.5) j += 1;
  }
  return out;
}

/* semua lewat satu kasir */
function bankerTransfers(nets, bankerId) {
  const out = [];
  nets.forEach((n) => {
    if (n.id === bankerId) return;
    if (n.net < -0.5) out.push({ from: n.id, to: bankerId, amount: Math.round(-n.net) });
    else if (n.net > 0.5) out.push({ from: bankerId, to: n.id, amount: Math.round(n.net) });
  });
  return out;
}

/* ---------- chip disc ---------- */
function Chip({ d, size = 28, qty }) {
  return (
    <span className="chip-wrap">
      <span
        className="chip"
        style={{
          width: size,
          height: size,
          background: d.color,
          color: d.ink,
          fontSize: size * 0.34,
        }}
      >
        {d.value}
      </span>
      {qty !== undefined ? <span className="chip-qty">×{qty}</span> : null}

/* ---------- kartu mini ---------- */
function MiniCard({ code }) {
  const suit = code.slice(-1);
  const face = code.slice(0, -1);
  const red = suit === "♥" || suit === "♦";
  return (
    <span className={"mcard" + (red ? " red" : "")}>
      <b>{face}</b>
      <i>{suit}</i>
    </span>
  );
}

/* ---------- modal ---------- */
function Sheet({ title, sub, onClose, children }) {
  return (
    <div className="sheet-back" onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-grip" />
        <div className="sheet-head">
          <div>
            <h3>{title}</h3>
            {sub ? <p>{sub}</p> : null}

}

/* ============================================================ */
function App() {
  const [tab, setTab] = useState("meja");
  const [cloud, setCloud] = useState("checking");
  const [roster, setRoster] = useState([]);
  const [archive, setArchive] = useState([]);
  const [toast, setToast] = useState(null);

  const [session, setSession] = useState(() => ({
    id: uid(),
    name: "Sesi " + new Date().toLocaleDateString("id-ID"),
    playedAt: new Date().toISOString().slice(0, 10),
    location: "",
    chipRate: 1000,
    maxSeats: 8,
    status: "open",
    mode: "direct",
    bankerId: null,
    adjust: "none",
    seats: [],
  }));

  const [modal, setModal] = useState(null);
  const [paid, setPaid] = useState({});
  const [settlements, setSettlements] = useState([]);

  const flash = (m) => {
    setToast(m);
    setTimeout(() => setToast(null), 2600);
  };

  /* ---- cek koneksi + tarik data ---- */
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const p = await sbSelect("players", "select=*&order=name");
        if (!alive) return;
        setRoster(p || []);
        setCloud("online");
        const h = await sbSelect(
          "v_session_balance",
          "select=*&status=eq.closed&order=played_at.desc&limit=25"
        );
        if (alive) setArchive(h || []);
      } catch (e) {
        if (alive) setCloud("offline");
      }
    })();
    return () => {
      alive = false;
    };
  }, []);

  /* ---- perhitungan inti ---- */
  const stats = useMemo(() => {
    const rate = Number(session.chipRate) || 0;
    const rows = session.seats.map((s) => {
      const inChips = s.buyins.reduce((a, b) => a + Number(b.chips), 0);
      const outChips = s.final === null ? null : s.final;
      return {
        key: s.key,
        seatNo: s.seatNo,
        id: s.playerId,
        name: s.name,
        avatar: s.avatar,
        out: s.status === "out",
        leftAt: s.leftAt,
        buyins: s.buyins,
        inChips,
        outChips,
        inIdr: inChips * rate,
        outIdr: (outChips || 0) * rate,
      };
    });
    const totalIn = rows.reduce((a, r) => a + r.inChips, 0);
    const counted = rows.filter((r) => r.outChips !== null);
    const totalOut = counted.reduce((a, r) => a + r.outChips, 0);
    const variance = counted.length === rows.length && rows.length > 0 ? totalOut - totalIn : null;

    const n = rows.length || 1;
    const adjusted = rows.map((r) => {
      let out = r.outChips === null ? 0 : r.outChips;
      if (variance !== null && variance !== 0) {
        if (session.adjust === "split") out -= variance / n;
        else if (session.adjust === "host" && r.id === session.bankerId) out -= variance;
      }
      const netChips = out - r.inChips;
      return { ...r, adjChips: out, netChips, net: netChips * rate };
    });

    const residual = adjusted.reduce((a, r) => a + r.netChips, 0);

    /* Pemain yang sudah keluar diselesaikan tunai lewat kasir saat itu juga.
       Kas kasir jadi berkurang/bertambah, dan itu harus ditagih balik di
       settlement akhir. bankerAdjust = jumlah net semua pemain yang keluar. */
    const gone = adjusted.filter((r) => r.out);
    const staying = adjusted.filter((r) => !r.out);
    const bankerAdjust = gone.reduce((a, r) => a + r.net, 0);

    const winners = adjusted.filter((r) => r.outChips !== null && r.net > 0);
    const losers = adjusted.filter((r) => r.outChips !== null && r.net < 0);
    const evens = adjusted.filter((r) => r.outChips !== null && r.net === 0);

    return {
      rate,
      rows: adjusted,
      gone,
      staying,
      bankerAdjust,
      winners,
      losers,
      evens,
      totalIn,
      totalOut,
      variance,
      residual,
      allCounted: counted.length === rows.length && rows.length > 0,
      totalInIdr: totalIn * rate,
      totalOutIdr: totalOut * rate,
    };
  }, [session]);

  const balanced = stats.variance === 0 || (stats.variance !== null && session.adjust !== "none");

  /* ---- aksi meja ---- */
  const seatPlayer = (seatNo, player, openingChips) => {
    const key = uid();
    setSession((s) => ({
      ...s,
      seats: [
        ...s.seats,
        {
          key,
          seatNo,
          playerId: player.id,
          name: player.name,
          avatar: player.avatar_seed || null,
          buyins:
            openingChips > 0
              ? [
                  {
                    id: uid(),
                    chips: Number(openingChips),
                    kind: "buyin",
                    at: new Date().toISOString(),
                  },
                ]
              : [],
          final: null,
          breakdown: {},
          status: "playing",
          leftAt: null,
        },
      ].sort((a, b) => a.seatNo - b.seatNo),
    }));
  };

  /* Pemain keluar tengah sesi: chip dikunci, kursi dikosongkan,
     tapi catatannya tetap tinggal di buku supaya balance tidak bocor. */
  const cashOut = (key, total, breakdown) =>
    setSession((s) => ({
      ...s,
      seats: s.seats.map((x) =>
        x.key === key
          ? {
              ...x,
              final: total,
              breakdown: breakdown || {},
              status: "out",
              leftAt: new Date().toISOString(),
            }
          : x
      ),
    }));

  const removeSeat = (key) =>
    setSession((s) => ({ ...s, seats: s.seats.filter((x) => x.key !== key) }));

  const addBuyin = (key, chips, kind) =>
    setSession((s) => ({
      ...s,
      seats: s.seats.map((x) =>
        x.key === key
          ? {
              ...x,
              buyins: [
                ...x.buyins,
                { id: uid(), chips: Number(chips), kind, at: new Date().toISOString() },
              ],
            }
          : x
      ),
    }));

  const dropBuyin = (key, bid) =>
    setSession((s) => ({
      ...s,
      seats: s.seats.map((x) =>
        x.key === key ? { ...x, buyins: x.buyins.filter((b) => b.id !== bid) } : x
      ),
    }));

  const setFinal = (key, total, breakdown) =>
    setSession((s) => ({
      ...s,
      seats: s.seats.map((x) =>
        x.key === key ? { ...x, breakdown: breakdown || {}, final: total } : x
      ),
    }));

  const addPlayer = async (name, avatar) => {
    const row = { name, avatar_seed: avatar || null };
    if (cloud === "online") {
      try {
        const res = await sbInsert("players", [row]);
        const created = res[0];
        setRoster((r) => [...r, created].sort((a, b) => a.name.localeCompare(b.name)));
        return created;
      } catch (e) {
        flash("Gagal simpan ke cloud, pemain dipakai lokal saja");
      }
    }
    const local = { ...row, id: uid(), local: true };
    setRoster((r) => [...r, local].sort((a, b) => a.name.localeCompare(b.name)));
    return local;
  };

  const setAvatar = async (playerId, seed) => {
    setRoster((r) => r.map((p) => (p.id === playerId ? { ...p, avatar_seed: seed } : p)));
    setSession((s) => ({
      ...s,
      seats: s.seats.map((x) => (x.playerId === playerId ? { ...x, avatar: seed } : x)),
    }));
    if (cloud === "online" && !String(playerId).startsWith("x")) {
      try {
        await sbUpdate("players", "id=eq." + playerId, { avatar_seed: seed });
      } catch (e) {
        flash("Avatar tersimpan di layar ini, tapi gagal ke cloud");
      }
    }
  };

  /* ---- settlement ---- */
  const lockAndSettle = () => {
    /* Hanya pemain yang masih di meja yang ikut settlement akhir.
       Yang sudah keluar sudah lunas dengan kasir. Selisih kas kasir
       dibebankan ke net kasir supaya totalnya tetap nol. */
    const nets = stats.staying.map((r) => ({
      id: r.id,
      net: r.net + (r.id === session.bankerId ? stats.bankerAdjust : 0),
    }));
    const list =
      session.mode === "banker" && session.bankerId
        ? bankerTransfers(nets, session.bankerId)
        : minTransfers(nets);
    setSettlements(list);
    setPaid({});
    setSession((s) => ({ ...s, status: "settling" }));
    setTab("bayar");
  };

  const saveToCloud = async () => {
    if (cloud !== "online") {
      flash("Cloud tidak terhubung — data tetap aman di layar ini");
      return;
    }
    try {
      const ses = await sbInsert("sessions", [
        {
          name: session.name,
          played_at: session.playedAt,
          location: session.location || null,
          chip_rate: session.chipRate,
          status: "closed",
          settlement_mode: session.mode,
          banker_player_id:
            session.mode === "banker" && session.bankerId && !String(session.bankerId).startsWith("x")
              ? session.bankerId
              : null,
          max_seats: session.maxSeats,
          ended_at: new Date().toISOString(),
        },
      ]);
      const sid = ses[0].id;
      const spRows = session.seats
        .filter((s) => !String(s.playerId).startsWith("x"))
        .map((s) => ({
          session_id: sid,
          player_id: s.playerId,
          seat_no: s.seatNo,
          final_chips: s.final,
          final_breakdown: s.breakdown,
          counted_at: s.final === null ? null : new Date().toISOString(),
          left_at: s.leftAt,
        }));
      const sp = spRows.length ? await sbInsert("session_players", spRows) : [];
      const map = {};
      sp.forEach((r) => {
        map[r.player_id] = r.id;
      });
      const bRows = [];
      session.seats.forEach((s) => {
        if (!map[s.playerId]) return;
        s.buyins.forEach((b) => {
          bRows.push({
            session_id: sid,
            session_player_id: map[s.playerId],
            kind: b.kind,
            chips: b.chips,
            amount_idr: b.chips * session.chipRate,
          });
        });
      });
      if (bRows.length) await sbInsert("buyins", bRows);
      const stRows = settlements
        .filter((t) => map[t.from] && map[t.to])
        .map((t) => ({
          session_id: sid,
          from_player_id: t.from,
          to_player_id: t.to,
          amount_idr: t.amount,
          mode: session.mode,
          is_paid: !!paid[t.from + t.to],
          is_cashout: false,
        }));

      /* Cash-out tengah sesi dicatat terpisah, sudah lunas saat pemain pulang */
      if (session.bankerId && map[session.bankerId]) {
        session.seats
          .filter((sp) => sp.status === "out" && map[sp.playerId])
          .forEach((sp) => {
            const r = stats.rows.find((x) => x.key === sp.key);
            if (!r || Math.abs(r.net) < 1) return;
            stRows.push({
              session_id: sid,
              from_player_id: r.net > 0 ? session.bankerId : sp.playerId,
              to_player_id: r.net > 0 ? sp.playerId : session.bankerId,
              amount_idr: Math.round(Math.abs(r.net)),
              mode: "banker",
              is_paid: true,
              is_cashout: true,
              note: "Cash out tengah sesi",
            });
          });
      }
      if (stRows.length) await sbInsert("settlements", stRows);
      setSession((s) => ({ ...s, status: "closed" }));
      flash("Sesi tersimpan ke cloud");
    } catch (e) {
      flash("Gagal simpan: " + String(e.message).slice(0, 60));
    }
  };

  const newSession = () => {
    setSession({
      id: uid(),
      name: "Sesi " + new Date().toLocaleDateString("id-ID"),
      playedAt: new Date().toISOString().slice(0, 10),
      location: "",
      chipRate: session.chipRate,
      maxSeats: session.maxSeats,
      status: "open",
      mode: session.mode,
      bankerId: null,
      adjust: "none",
      seats: [],
    });
    setSettlements([]);
    setPaid({});
    setTab("meja");
  };

  const nameOf = (id) => {
    const r = stats.rows.find((x) => x.id === id);
    return r ? r.name : "?";
  };

  /* ============================================================ */
  return (
    <div className="app">
      <style>{CSS}</style>

      <header className="top">
        <div className="brand">
          <SuitMark />
          <div>
            <h1>POTBOOK</h1>
            <span>Pembukuan meja, tanpa selisih</span>
          </div>
        </div>
        <div className={"link " + cloud}>
          <i />
          {cloud === "online" ? "Cloud" : cloud === "offline" ? "Lokal" : "…"}
        </div>
      </header>

      <main>
        {tab === "meja" ? (
          <TableView
            session={session}
            setSession={setSession}
            stats={stats}
            roster={roster}
            onSeat={seatPlayer}
            onCashOut={cashOut}
            onRemove={removeSeat}
            onBuyin={addBuyin}
            onFinal={setFinal}
            onAddPlayer={addPlayer}
            onAvatar={setAvatar}
            modal={modal}
            setModal={setModal}
          />
        ) : null}

        {tab === "buku" ? (
          <LedgerView
            session={session}
            setSession={setSession}
            stats={stats}
            balanced={balanced}
            onDropBuyin={dropBuyin}
            onLock={lockAndSettle}
          />
        ) : null}

        {tab === "bayar" ? (
          <SettleView
            session={session}
            setSession={setSession}
            stats={stats}
            settlements={settlements}
            paid={paid}
            setPaid={setPaid}
            nameOf={nameOf}
            onLock={lockAndSettle}
            onSave={saveToCloud}
            onNew={newSession}
          />
        ) : null}

        {tab === "kartu" ? <HandsView /> : null}

        {tab === "arsip" ? <ArchiveView archive={archive} cloud={cloud} /> : null}
      </main>

      <nav className="tabs">
        {[
          ["meja", "Meja", "♠"],
          ["buku", "Buku", "▤"],
          ["bayar", "Bayar", "⇄"],
          ["kartu", "Kartu", "♦"],
          ["arsip", "Arsip", "◷"],
        ].map(([k, label, ic]) => (
          <button
            key={k}
            className={tab === k ? "on" : ""}
            onClick={() => setTab(k)}
          >
            <span className="ic">{ic}</span>
            {label}
          </button>
        ))}
      </nav>

      {toast ? <div className="toast">{toast}</div> : null}
    </div>
  );
}

/* ============================================================
   MEJA
   ============================================================ */
function TableView({
  session,
  setSession,
  stats,
  roster,
  onSeat,
  onCashOut,
  onRemove,
  onBuyin,
  onFinal,
  onAddPlayer,
  onAvatar,
  modal,
  setModal,
}) {
  const seats = [];
  for (let i = 1; i <= session.maxSeats; i += 1) {
    const occ = session.seats.find((s) => s.seatNo === i && s.status === "playing");
    seats.push({ seatNo: i, occ });
  }
  const banker = stats.rows.find((r) => r.id === session.bankerId) || null;

  const pos = (i, total) => {
    const a = (Math.PI * 2 * (i - 1)) / total - Math.PI / 2;
    return { left: 50 + 43 * Math.cos(a) + "%", top: 50 + 40 * Math.sin(a) + "%" };
  };

  const rowFor = (key) => stats.rows.find((r) => r.key === key);
  const potChips = stats.totalIn;

  return (
    <div className="pad">
      <div className="setup">
        <label>
          <span>Nilai 1 chip</span>
          <div className="rate">
            <b>Rp</b>
            <input
              type="number"
              value={session.chipRate}
              onChange={(e) =>
                setSession((s) => ({ ...s, chipRate: Number(e.target.value) || 0 }))
              }
            />
          </div>
        </label>
        <label>
          <span>Kursi</span>
          <select
            value={session.maxSeats}
            onChange={(e) =>
              setSession((s) => ({ ...s, maxSeats: Number(e.target.value) }))
            }
          >
            {[4, 5, 6, 7, 8, 9, 10].map((n) => (
              <option key={n} value={n}>
                {n}
              </option>
            ))}
          </select>
        </label>
      </div>

      <label className="banker-pick">
        <span>Kasir — pemegang uang tunai</span>
        <select
          value={session.bankerId || ""}
          onChange={(e) => setSession((s) => ({ ...s, bankerId: e.target.value || null }))}
        >
          <option value="">— belum ditentukan —</option>
          {stats.rows.filter((r) => !r.out).map((r) => (
            <option key={r.id} value={r.id}>
              {r.name}
            </option>
          ))}
        </select>
      </label>

      <div className={"felt-wrap" + (stats.variance !== null && stats.variance !== 0 ? " off" : stats.allCounted ? " ok" : "")}>
        <div className="felt">
          <div className="felt-core">
            <div className="pot-label">POT DI MEJA</div>
            <div className="pot-val">{rp(potChips * stats.rate)}</div>
            <div className="pot-sub">{num(potChips)} chip · {session.seats.length} pemain</div>
            <div className="pot-chips">
              {DENOMS.slice(2).map((d) => (
                <Chip key={d.value} d={d} size={22} />
              ))}
            </div>
          </div>
        </div>

        {seats.map((s) => {
          const r = s.occ ? rowFor(s.occ.key) : null;
          const style = pos(s.seatNo, session.maxSeats);
          if (!s.occ)
            return (
              <button
                key={s.seatNo}
                className="seat empty"
                style={style}
                onClick={() => setModal({ type: "sit", seatNo: s.seatNo })}
              >
                <span className="plus">+</span>
                <em>{s.seatNo}</em>
              </button>
            );
          const net = r ? r.net : 0;
          const cls = r && r.outChips !== null ? (net > 0 ? "up" : net < 0 ? "down" : "") : "";
          return (
            <button
              key={s.seatNo}
              className={"seat taken " + cls}
              style={style}
              onClick={() => setModal({ type: "player", key: s.occ.key })}
            >
              <Ava seed={s.occ.avatar} name={s.occ.name} size={44} />
              <em className="nm">{s.occ.name.split(" ")[0]}</em>
              <em className="mn">
                {r && r.outChips !== null ? signed(net) : num(r ? r.inChips : 0) + " chip"}
              </em>
            </button>
          );
        })}
      </div>

      <div className="quickbar">
        <div className="qb-item">
          <span>Masuk</span>
          <b>{rp(stats.totalInIdr)}</b>
        </div>
        <div className="qb-item">
          <span>Keluar</span>
          <b>{stats.allCounted ? rp(stats.totalOutIdr) : "—"}</b>
        </div>
        <div className={"qb-item " + (stats.variance === 0 ? "good" : stats.variance === null ? "" : "bad")}>
          <span>Selisih</span>
          <b>{stats.variance === null ? "—" : signed(stats.variance * stats.rate)}</b>
        </div>
      </div>

      {stats.gone.length ? (
        <>
          <h2 className="sec">Sudah pulang</h2>
          <div className="gone-list">
            {stats.gone.map((g) => (
              <div key={g.key} className="gone">
                <Ava seed={g.avatar} name={g.name} size={30} />
                <div className="gone-main">
                  <b>{g.name}</b>
                  <em>{num(g.outChips)} chip ditukar</em>
                </div>
                <span className={"gone-net " + (g.net >= 0 ? "up" : "down")}>
                  {g.net > 0 ? "cash out " : g.net < 0 ? "bayar " : "impas "}
                  {g.net === 0 ? "" : rp(g.net)}
                </span>
              </div>
            ))}
          </div>
          <div className="kas">
            Kas kasir {stats.bankerAdjust > 0 ? "berkurang" : stats.bankerAdjust < 0 ? "bertambah" : "tetap"}{" "}
            <b>{rp(stats.bankerAdjust)}</b> — ditagih balik saat settlement akhir.
          </div>
        </>
      ) : null}

      <p className="hint">
        Tap kursi kosong untuk mendudukkan pemain. Tap pemain untuk rebuy, hitung chip, atau
        menyelesaikan kepulangannya.
      </p>

      {modal && modal.type === "sit" ? (
        <SitSheet
          seatNo={modal.seatNo}
          roster={roster}
          taken={session.seats.map((s) => s.playerId)}
          onPick={(p, chips) => {
            onSeat(modal.seatNo, p, chips);
            setModal(null);
          }}
          onAddPlayer={onAddPlayer}
          onAvatar={onAvatar}
          onClose={() => setModal(null)}
        />
      ) : null}

      {modal && modal.type === "player" && session.seats.find((s) => s.key === modal.key) ? (
        <PlayerSheet
          seat={session.seats.find((s) => s.key === modal.key)}
          row={stats.rows.find((r) => r.key === modal.key)}
          rate={stats.rate}
          banker={banker}
          onBuyin={(c, k) => onBuyin(modal.key, c, k)}
          onFinal={(t, bd) => onFinal(modal.key, t, bd)}
          onCashOut={(t, bd) => onCashOut(modal.key, t, bd)}
          onAvatar={onAvatar}
          onRemove={() => {
            onRemove(modal.key);
            setModal(null);
          }}
          onClose={() => setModal(null)}
        />
      ) : null}
    </div>
  );
}

/* ---------- sheet: dudukkan pemain ---------- */
function SitSheet({ seatNo, roster, taken, onPick, onAddPlayer, onAvatar, onClose }) {
  const [editing, setEditing] = useState(null);
  const [chips, setChips] = useState(100);
  const [newName, setNewName] = useState("");
  const [seed, setSeed] = useState(null);
  const [adding, setAdding] = useState(false);
  const free = roster.filter((p) => !taken.includes(p.id));

  return (
    <Sheet title={"Kursi " + seatNo} sub="Pilih pemain dan buy-in awal" onClose={onClose}>
      <div className="field">
        <span>Buy-in awal (chip)</span>
        <div className="presets">
          {[50, 100, 200, 500].map((c) => (
            <button key={c} className={chips === c ? "on" : ""} onClick={() => setChips(c)}>
              {c}
            </button>
          ))}
          <input
            type="number"
            value={chips}
            onChange={(e) => setChips(Number(e.target.value) || 0)}
          />
        </div>
      </div>

      {!adding ? (
        <>
          <div className="list">
            {free.length === 0 ? (
              <p className="empty">Belum ada pemain. Tambahkan dulu di bawah.</p>
            ) : null}
            {free.map((p) => (
              <div key={p.id} className="rowwrap">
                <div className="rowbtn">
                  <button
                    className="ava-btn"
                    onClick={() => setEditing(editing === p.id ? null : p.id)}
                    title="Ubah avatar"
                  >
                    <Ava seed={p.avatar_seed} name={p.name} size={34} />
                  </button>
                  <button className="rb-main" onClick={() => onPick(p, chips)}>
                    <b>{p.name}</b>
                    <em>{p.avatar_seed ? "Tap avatar untuk ganti" : "Belum ada avatar"}</em>
                  </button>
                  <button className="go" onClick={() => onPick(p, chips)}>
                    Dudukkan
                  </button>
                </div>
                {editing === p.id ? (
                  <div className="edit-ava">
                    <AvaPicker
                      value={p.avatar_seed}
                      onPick={(seed) => {
                        onAvatar(p.id, seed);
                        setEditing(null);
                      }}
                    />
                  </div>
                ) : null}
              </div>
            ))}
          </div>
          <button className="ghost full" onClick={() => setAdding(true)}>
            + Pemain baru
          </button>
        </>
      ) : (
        <div className="form">
          <label>
            <span>Nama</span>
            <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Nama pemain" />
          </label>
          <label>
            <span>Avatar</span>
            <AvaPicker value={seed} onPick={setSeed} />
          </label>
          <div className="row2">
            <button className="ghost" onClick={() => setAdding(false)}>
              Batal
            </button>
            <button
              className="primary"
              disabled={!newName.trim()}
              onClick={async () => {
                const p = await onAddPlayer(newName.trim(), seed);
                onPick(p, chips);
              }}
            >
              Simpan &amp; dudukkan
            </button>
          </div>
        </div>
      )}
    </Sheet>
  );
}

/* ---------- sheet: detail pemain ---------- */
function PlayerSheet({ seat, row, rate, banker, onBuyin, onFinal, onCashOut, onRemove, onAvatar, onClose }) {
  const [mode, setMode] = useState("rebuy");
  const [showAva, setShowAva] = useState(false);
  const [chips, setChips] = useState(100);
  const [entry, setEntry] = useState("denom");
  const [bd, setBd] = useState(seat.breakdown || {});
  const [tot, setTot] = useState(seat.final === null ? "" : String(seat.final));

  const total = entry === "denom" ? breakdownTotal(bd) : Math.max(0, Number(tot) || 0);
  const net = (total - row.inChips) * rate;
  const bump = (v, d) =>
    setBd((b) => ({ ...b, [v]: Math.max(0, (Number(b[v]) || 0) + d) }));

  const counter = (
    <>
      <div className="segs sub">
        <button className={entry === "denom" ? "on" : ""} onClick={() => setEntry("denom")}>
          Hitung per warna
        </button>
        <button className={entry === "total" ? "on" : ""} onClick={() => setEntry("total")}>
          Isi total langsung
        </button>
      </div>

      {entry === "denom" ? (
        <div className="counter">
          {DENOMS.map((d) => (
            <div key={d.value} className="cnt-row">
              <Chip d={d} size={32} />
              <span className="cnt-label">{d.label}</span>
              <button onClick={() => bump(d.value, -1)}>−</button>
              <input
                type="number"
                value={bd[d.value] || 0}
                onChange={(e) =>
                  setBd((b) => ({ ...b, [d.value]: Math.max(0, Number(e.target.value) || 0) }))
                }
              />
              <button onClick={() => bump(d.value, 1)}>+</button>
              <b>{num((Number(bd[d.value]) || 0) * d.value)}</b>
            </div>
          ))}
        </div>
      ) : (
        <div className="field">
          <span>Total chip tersisa</span>
          <input
            className="bigin"
            type="number"
            value={tot}
            placeholder="0"
            onChange={(e) => setTot(e.target.value)}
          />
          <p className="sub-note">Setara {rp(total * rate)}</p>
        </div>
      )}

      <div className="count-total">
        <div>
          <span>Sisa chip</span>
          <b>{num(total)}</b>
        </div>
        <div>
          <span>Nilai</span>
          <b className="gold">{rp(total * rate)}</b>
        </div>
        <div>
          <span>Net</span>
          <b className={net >= 0 ? "up" : "down"}>{signed(net)}</b>
        </div>
      </div>
    </>
  );

  return (
    <Sheet
      title={seat.name}
      sub={"Kursi " + seat.seatNo + " · beli " + num(row.inChips) + " chip · " + rp(row.inIdr)}
      onClose={onClose}
    >
      <button className="ava-strip" onClick={() => setShowAva(!showAva)}>
        <Ava seed={seat.avatar} name={seat.name} size={40} />
        <span>{seat.avatar ? "Ganti avatar" : "Pilih avatar"}</span>
        <em>{showAva ? "▲" : "▼"}</em>
      </button>
      {showAva ? (
        <div className="edit-ava">
          <AvaPicker
            value={seat.avatar}
            onPick={(sd) => {
              onAvatar(seat.playerId, sd);
              setShowAva(false);
            }}
          />
        </div>
      ) : null}

      <div className="segs">
        <button className={mode === "rebuy" ? "on" : ""} onClick={() => setMode("rebuy")}>
          Rebuy
        </button>
        <button className={mode === "count" ? "on" : ""} onClick={() => setMode("count")}>
          Hitung chip
        </button>
        <button className={mode === "out" ? "on" : ""} onClick={() => setMode("out")}>
          Keluar
        </button>
      </div>

      {mode === "rebuy" ? (
        <>
          <div className="field">
            <span>Tambah chip</span>
            <div className="presets">
              {[50, 100, 200, 500].map((c) => (
                <button key={c} className={chips === c ? "on" : ""} onClick={() => setChips(c)}>
                  {c}
                </button>
              ))}
              <input
                type="number"
                value={chips}
                onChange={(e) => setChips(Number(e.target.value) || 0)}
              />
            </div>
          </div>
          <div className="row2">
            <button className="ghost" onClick={() => onBuyin(chips, "rebuy")}>
              Rebuy {num(chips)}
            </button>
            <button className="primary" onClick={() => onBuyin(chips, "addon")}>
              Add-on {num(chips)}
            </button>
          </div>
          <div className="mini-ledger">
            {row.buyins.length === 0 ? <p className="empty">Belum ada transaksi.</p> : null}
            {row.buyins.map((b, i) => (
              <div key={b.id} className="ml-row">
                <em>{i + 1}</em>
                <span>{i === 0 ? "buy-in" : b.kind}</span>
                <b>{num(b.chips)} chip</b>
                <i>{rp(b.chips * rate)}</i>
              </div>
            ))}
          </div>
          {row.buyins.length === 0 ? (
            <button className="danger full" onClick={onRemove}>
              Batalkan, pemain belum main
            </button>
          ) : null}
        </>
      ) : null}

      {mode === "count" ? (
        <>
          {counter}
          <button
            className="primary full"
            onClick={() => {
              onFinal(total, entry === "denom" ? bd : {});
              onClose();
            }}
          >
            Kunci hitungan
          </button>
          <p className="sub-note center">Pemain tetap duduk. Untuk pulang, pakai tab Keluar.</p>
        </>
      ) : null}

      {mode === "out" ? (
        <>
          {counter}

          <div className={"verdict " + (net > 0 ? "up" : net < 0 ? "down" : "flat")}>
            <div className="v-head">
              {net > 0 ? "CASH OUT" : net < 0 ? "HARUS BAYAR" : "IMPAS"}
              <b>{signed(net)}</b>
            </div>
            <p>
              {net > 0
                ? "Kasir " + (banker ? banker.name : "—") + " tukar " + num(total) +
                  " chip milik " + seat.name + " jadi uang tunai " + rp(net) + "."
                : net < 0
                ? seat.name + " transfer " + rp(-net) + " ke kasir " +
                  (banker ? banker.name : "—") + ", lalu chipnya dikembalikan."
                : seat.name + " pulang impas. Chip dikembalikan, tidak ada uang berpindah."}
            </p>
          </div>

          {!banker ? (
            <p className="warn">Tentukan kasir dulu di bagian atas tab Meja.</p>
          ) : null}

          <button
            className="primary full"
            disabled={!banker}
            onClick={() => {
              onCashOut(total, entry === "denom" ? bd : {});
              onClose();
            }}
          >
            Selesaikan &amp; kosongkan kursi
          </button>
          <p className="sub-note center">
            Catatannya tetap tersimpan di buku, jadi balance akhir tidak bergeser.
          </p>
        </>
      ) : null}
    </Sheet>
  );
}

function LedgerView({ session, setSession, stats, balanced, onDropBuyin, onLock }) {
  const v = stats.variance;
  return (
    <div className="pad">
      <h2 className="sec">Buku besar</h2>

      <div className={"guard " + (v === null ? "wait" : v === 0 ? "good" : "bad")}>
        <div className="guard-top">
          <span>{v === null ? "Menunggu hitungan chip" : v === 0 ? "Meja balance" : "Ada selisih"}</span>
          <b>{v === null ? "—" : signed(v * stats.rate)}</b>
        </div>
        <div className="guard-bars">
          <div className="gb">
            <span>Uang masuk</span>
            <b>{rp(stats.totalInIdr)}</b>
          </div>
          <div className="gb">
            <span>Uang keluar</span>
            <b>{stats.allCounted ? rp(stats.totalOutIdr) : "—"}</b>
          </div>
        </div>
        {v !== null && v !== 0 ? (
          <div className="fix">
            <p>
              Chip yang dihitung {v > 0 ? "lebih banyak" : "lebih sedikit"} {num(Math.abs(v))} dari
              yang dibeli. Hitung ulang, atau pilih cara menutupnya:
            </p>
            <div className="segs">
              <button
                className={session.adjust === "none" ? "on" : ""}
                onClick={() => setSession((s) => ({ ...s, adjust: "none" }))}
              >
                Hitung ulang
              </button>
              <button
                className={session.adjust === "split" ? "on" : ""}
                onClick={() => setSession((s) => ({ ...s, adjust: "split" }))}
              >
                Bagi rata
              </button>
              <button
                className={session.adjust === "host" ? "on" : ""}
                onClick={() => setSession((s) => ({ ...s, adjust: "host" }))}
                disabled={!session.bankerId}
              >
                Bebankan ke host
              </button>
            </div>
          </div>
        ) : null}
      </div>

      <h2 className="sec">Posisi pemain</h2>
      <div className="ledger">
        {stats.rows.length === 0 ? <p className="empty">Meja masih kosong.</p> : null}
        {stats.rows.map((r) => (
          <div key={r.key} className="lg-card">
            <div className="lg-head">
              <Ava seed={r.avatar} name={r.name} size={34} />
              <div className="lg-name">
                <b>{r.name}</b>
                <em>Kursi {r.seatNo} · {r.buyins.length}× beli chip</em>
              </div>
              <div className={"lg-net " + (r.outChips === null ? "" : r.net >= 0 ? "up" : "down")}>
                {r.outChips === null ? "belum dihitung" : signed(r.net)}
              </div>
            </div>
            <div className="lg-nums">
              <div>
                <span>Beli</span>
                <b>{num(r.inChips)} chip</b>
                <i>{rp(r.inIdr)}</i>
              </div>
              <div>
                <span>Sisa</span>
                <b>{r.outChips === null ? "—" : num(r.outChips) + " chip"}</b>
                <i>{r.outChips === null ? "" : rp(r.outIdr)}</i>
              </div>
            </div>
            <div className="lg-buyins">
              {r.buyins.map((b, i) => (
                <button
                  key={b.id}
                  className="tag"
                  onClick={() => onDropBuyin(r.key, b.id)}
                  title="Tap untuk hapus"
                >
                  {i === 0 ? "buy-in" : b.kind} {num(b.chips)} ✕
                </button>
              ))}
            </div>
          </div>
        ))}

      <button className="primary full big" disabled={!stats.allCounted || !balanced} onClick={onLock}>
        {stats.allCounted ? "Kunci & hitung transfer" : "Hitung chip semua pemain dulu"}
      </button>
    </div>
  );
}

/* ============================================================
   BAYAR
   ============================================================ */
function SettleView({
  session,
  setSession,
  stats,
  settlements,
  paid,
  setPaid,
  nameOf,
  onLock,
  onSave,
  onNew,
}) {
  const rowOf = (id) => stats.rows.find((r) => r.id === id);
  const done = settlements.filter((t) => paid[t.from + t.to]).length;

  const copy = (txt) => {
    const ta = document.createElement("textarea");
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
    } catch (e) {
      /* diabaikan */
    }
    document.body.removeChild(ta);
  };

  const w = stats.winners.length;
  const l = stats.losers.length;
  const e = stats.evens.length;
  const totalLoss = stats.losers.reduce((a, r) => a + Math.abs(r.net), 0);

  return (
    <div className="pad">
      <h2 className="sec">Rekap sesi</h2>

      {!stats.allCounted ? (
        <p className="empty">
          Masih ada pemain yang chipnya belum dihitung. Selesaikan di tab Meja dulu.
        </p>
      ) : (
        <>
          <div className="tally">
            <div className="ty up">
              <b>{w}</b>
              <span>menang</span>
            </div>
            <div className="ty down">
              <b>{l}</b>
              <span>rugi &amp; harus bayar</span>
            </div>
            <div className="ty">
              <b>{e}</b>
              <span>impas</span>
            </div>
          </div>

          <div className="tally">
            <div className="ty wide">
              <b className="gold">{rp(stats.totalInIdr)}</b>
              <span>uang berputar</span>
            </div>
            <div className="ty wide">
              <b className="down">{rp(totalLoss)}</b>
              <span>total yang harus dibayar</span>
            </div>
          </div>

          <div className="standing">
            {stats.rows
              .slice()
              .sort((a, b) => b.net - a.net)
              .map((r) => (
                <div key={r.key} className="st-row">
                  <Ava seed={r.avatar} name={r.name} size={30} />
                  <div className="st-main">
                    <b>{r.name}</b>
                    <em>
                      {r.out ? "sudah pulang · " : ""}
                      {num(r.inChips)} → {num(r.outChips === null ? 0 : r.outChips)} chip
                    </em>
                  </div>
                  <span className={"st-net " + (r.net > 0 ? "up" : r.net < 0 ? "down" : "")}>
                    {signed(r.net)}
                  </span>
                </div>
              ))}
          </div>

          {stats.gone.length ? (
            <p className="sub-note">
              {stats.gone.length} pemain sudah diselesaikan tunai lewat kasir saat pulang.
              Selisih kas {rp(stats.bankerAdjust)} sudah dimasukkan ke hitungan kasir di bawah.
            </p>
          ) : null}
        </>
      )}

      <h2 className="sec">Pola settlement</h2>
      <div className="segs">
        <button
          className={session.mode === "direct" ? "on" : ""}
          onClick={() => setSession((s) => ({ ...s, mode: "direct" }))}
        >
          Antar pemain
        </button>
        <button
          className={session.mode === "banker" ? "on" : ""}
          onClick={() => setSession((s) => ({ ...s, mode: "banker" }))}
        >
          Lewat kasir
        </button>
      </div>

      {session.mode === "banker" ? (
        <div className="field">
          <span>Siapa kasirnya</span>
          <select
            value={session.bankerId || ""}
            onChange={(e) => setSession((s) => ({ ...s, bankerId: e.target.value || null }))}
          >
            <option value="">— pilih pemain —</option>
            {stats.rows.map((r) => (
              <option key={r.id} value={r.id}>
                {r.name}
              </option>
            ))}
          </select>
        </div>
      ) : null}

      {stats.gone.length && !session.bankerId ? (
        <p className="warn">
          Ada pemain yang sudah pulang, jadi kasir wajib ditentukan supaya kasnya bisa ditagih.
        </p>
      ) : null}

      <button
        className="ghost full"
        onClick={onLock}
        disabled={!stats.allCounted || (stats.gone.length > 0 && !session.bankerId)}
      >
        Hitung ulang transfer
      </button>

      <h2 className="sec">
        Daftar transfer
        {settlements.length ? <em className="cnt">{done}/{settlements.length} lunas</em> : null}
      </h2>

      {settlements.length === 0 ? (
        <p className="empty">Belum ada. Selesaikan hitungan chip di tab Buku dulu.</p>
      ) : null}

      <div className="transfers">
        {settlements.map((t) => {
          const key = t.from + t.to;
          const from = rowOf(t.from);
          const to = rowOf(t.to);
          return (
            <div key={key} className={"tf" + (paid[key] ? " done" : "")}>
              <div className="tf-flow">
                <Ava seed={from ? from.avatar : null} name={nameOf(t.from)} size={38} />
                <div className="tf-arrow">
                  <b>{rp(t.amount)}</b>
                  <i />
                </div>
                <Ava seed={to ? to.avatar : null} name={nameOf(t.to)} size={38} />
              </div>
              <div className="tf-names">
                <b>{nameOf(t.from)}</b>
                <span>transfer ke</span>
                <b>{nameOf(t.to)}</b>
              </div>
              <button
                className="ghost sm-btn"
                onClick={() => copy(nameOf(t.from) + " → " + nameOf(t.to) + ": " + rp(t.amount))}
              >
                Salin rincian
              </button>
              <button
                className={"mark" + (paid[key] ? " on" : "")}
                onClick={() => setPaid((p) => ({ ...p, [key]: !p[key] }))}
              >
                {paid[key] ? "✓ Sudah transfer" : "Tandai lunas"}
              </button>
            </div>
          );
        })}
      </div>

      {settlements.length ? (
        <div className="closing">
          <button className="primary full big" onClick={onSave} disabled={session.status === "closed"}>
            {session.status === "closed" ? "Sesi sudah ditutup" : "Simpan & tutup sesi"}
          </button>
          <button className="ghost full" onClick={onNew}>
            Mulai sesi baru
          </button>
        </div>
      ) : null}
    </div>
  );
}

/* ============================================================
   ARSIP
   ============================================================ */
function ArchiveView({ archive, cloud }) {
  return (
    <div className="pad">
      <h2 className="sec">Sesi tersimpan</h2>
      {cloud !== "online" ? (
        <p className="empty">
          Cloud tidak terhubung dari layar ini. Riwayat muncul setelah app dijalankan di
          browser biasa.
        </p>
      ) : archive.length === 0 ? (
        <p className="empty">Belum ada sesi yang ditutup.</p>
      ) : (
        <div className="arch">
          {archive.map((a) => (
            <div key={a.session_id} className="ar-card">
              <div className="ar-head">
                <b>{a.name}</b>
                <em>{a.played_at}</em>
              </div>
              <div className="ar-nums">
                <div>
                  <span>Pemain</span>
                  <b>{a.player_count}</b>
                </div>
                <div>
                  <span>Uang berputar</span>
                  <b>{rp(a.total_in_idr)}</b>
                </div>
                <div>
                  <span>Selisih</span>
                  <b className={Number(a.variance_idr) === 0 ? "up" : "down"}>
                    {signed(Number(a.variance_idr))}
                  </b>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

.gone-main em{font-size:10.5px;color:var(--mut)}
.gone-net{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut)}
.gone-net.up{color:var(--neon)}
.gone-net.down{color:var(--crim)}
.kas{margin-top:9px;font-size:11.5px;color:var(--mut);line-height:1.6;
  border-left:2px solid var(--gold);padding-left:10px}
.kas b{font-family:'JetBrains Mono',monospace;color:var(--gold)}

.tally{display:flex;gap:8px;margin-bottom:9px}
.ty{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 10px;text-align:center}
.ty b{display:block;font-family:'JetBrains Mono',monospace;font-size:22px;line-height:1.1}
.ty.wide b{font-size:15px}
.ty span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:5px}
.ty.up b{color:var(--neon)}
.ty.down b{color:var(--crim)}
.ty b.gold{color:var(--gold)}
.ty b.down{color:var(--crim)}

.standing{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.st-row{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.st-main{flex:1;min-width:0}
.st-main b{display:block;font-size:13px}
.st-main em{font-size:10.5px;color:var(--mut)}
.st-net{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--mut)}
.st-net.up{color:var(--neon)}
.st-net.down{color:var(--crim)}

.verdict{border-radius:14px;padding:13px;margin:14px 0 12px;border:1px solid var(--line)}
.verdict.up{border-color:rgba(34,228,200,.5);background:linear-gradient(180deg,rgba(34,228,200,.10),transparent)}
.verdict.down{border-color:rgba(255,77,109,.5);background:linear-gradient(180deg,rgba(255,77,109,.10),transparent)}
.v-head{display:flex;justify-content:space-between;align-items:baseline;
  font-family:'Chakra Petch';font-size:11.5px;letter-spacing:.18em;color:var(--mut)}
.v-head b{font-family:'JetBrains Mono',monospace;font-size:19px;letter-spacing:0}
.verdict.up .v-head b{color:var(--neon)}
.verdict.down .v-head b{color:var(--crim)}
.verdict p{margin:9px 0 0;font-size:12.5px;line-height:1.6;color:var(--tx)}

.segs.sub button{font-size:11.5px;padding:8px}
.bigin{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px;font-family:'JetBrains Mono',monospace;font-size:20px;text-align:center;outline:none}
.sub-note{font-size:11.5px;color:var(--mut);line-height:1.6;margin:8px 0 0}
.sub-note.center{text-align:center}
.warn{font-size:12px;color:var(--gold);line-height:1.6;background:rgba(242,193,78,.08);
  border:1px solid rgba(242,193,78,.3);border-radius:11px;padding:10px 12px;margin:12px 0 0}

.rowwrap{display:flex;flex-direction:column}
.rowbtn{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:9px 11px;text-align:left;width:100%}
.ava-btn{background:none;border:0;padding:0;cursor:pointer;position:relative;flex:none}
.ava-btn::after{content:"✎";position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;
  border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--mut);
  font-size:8px;display:flex;align-items:center;justify-content:center}
.rb-main{flex:1;min-width:0;background:none;border:0;padding:6px 0;cursor:pointer;text-align:left}
.go{background:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;
  font-size:11px;color:var(--neon);flex:none;cursor:pointer}
.edit-ava{background:rgba(255,255,255,.03);border:1px solid var(--line);border-top:0;
  border-radius:0 0 13px 13px;padding:11px;margin:-4px 6px 0}
.ava-strip{width:100%;display:flex;align-items:center;gap:11px;background:var(--panel);
  border:1px solid var(--line);border-radius:13px;padding:9px 12px;margin-bottom:12px;cursor:pointer}
.ava-strip span{flex:1;text-align:left;font-size:12.5px;color:var(--mut)}
.ava-strip em{color:var(--mut);font-size:10px}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;
  font-size:12.5px;max-width:88%;box-shadow:0 10px 30px rgba(0,0,0,.6)}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
@media (min-width:600px){
  .felt-wrap{aspect-ratio:1.28}
  .felt{inset:16% 8%}
}
`;
